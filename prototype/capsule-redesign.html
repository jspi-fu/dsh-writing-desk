<!doctype html>
<!--
  原型（抛弃式）：胶囊缩略语言对比。
  问题：胶囊九宫格里的成员缩略应该用什么语言，才能既保留「大文件夹」的容器概念，
       又解决现状「过小（真卡缩到 0.42 倍，标题 5.5px）、变形（格子锁 232:196 而卡高不定）」的问题？
  四个方案，?variant=a|b|c|d 切换，?open=c1|c2|c3 自动打开浮层：
    a · 现状   —— 真卡 transform 等比缩小进固定 232:196 格（复刻 client/capsule.jsx + styles.css）
    b · 封面格 —— 格子里只放媒体封面/衬线首字，排版按格子真实尺寸重排，不缩放
    c · 邮票版张 —— 沿用产品已有的邮票母题：胶囊是一张带齿孔的邮票版张，文字卡是票面印字的文字票
    d · 异形卡堆 —— 卡片按格子宽度重排（字号原大），两列瀑布流自动填充，超过 4 张折叠成纸堆
  数据取自 src/seed.js，素材引用 ../assets/*.jpg。仅供对比决策，不进生产分支。
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 胶囊缩略方案对比</title>
<style>
/* ---------- 宿主 token（按 DSH 浅色主题取近似值，与 client/styles.css 的 --dsw-* 别名对应） ---------- */
.md-root {
  --ink: #1f2329; --ink2: #4e5560; --ink3: #86909c; --ink4: #a9b0b8;
  --on-primary: #ffffff; --primary: #17181c; --primary-hover: #2a2c33;
  --line: rgb(0 0 0 / .08); --line-strong: rgb(0 0 0 / .14);
  --hover: rgb(0 0 0 / .05); --active: rgb(0 0 0 / .09);
  --bg: #f4f5f7; --card: #ffffff; --accent: #4176e6;
  --glass: rgb(255 255 255 / .72);
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --latin-serif: "Iowan Old Style", "Palatino", Georgia, serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-panel: 28px;
  --dsw-elevation-soft: 0 6px 20px -8px rgb(0 0 0 / .14);
  --dsw-elevation-prominent: 0 18px 50px -16px rgb(0 0 0 / .28);
  position: relative; width: 100%; min-height: 100vh; overflow: clip;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 22px; -webkit-font-smoothing: antialiased;
}
.md-root *, .md-root *::before, .md-root *::after { box-sizing: border-box; }
.md-root :is(h1, h2, h3, p, blockquote, footer, section, article, span, div) { margin: 0; padding: 0; }
.md-root button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ---------- 氛围背景 ---------- */
.md-ambient { position: fixed; inset: 0; overflow: clip; pointer-events: none; }
.md-ambient i { position: absolute; width: 56vmax; height: 56vmax; border-radius: 50%; filter: blur(70px); opacity: .5; animation: md-drift 42s ease-in-out infinite alternate; }
.md-ambient i:nth-child(1) { left: -18vmax; top: -24vmax; background: radial-gradient(circle, rgb(217 228 255 / 42%), transparent 68%); }
.md-ambient i:nth-child(2) { right: -14vmax; top: -8vmax; background: radial-gradient(circle, rgb(246 226 239 / 42%), transparent 68%); animation-delay: -14s; }
.md-ambient i:nth-child(3) { left: 22vmax; bottom: -34vmax; background: radial-gradient(circle, rgb(226 243 224 / 42%), transparent 68%); animation-delay: -28s; }
@keyframes md-drift { to { transform: translate3d(6vmax, 4vmax, 0) scale(1.12); } }

.proto-note { position: fixed; left: 14px; top: 14px; z-index: 998; padding: 5px 10px; border-radius: 999px; background: #17181c; color: #fff; font-size: 11px; line-height: 16px; opacity: .85; }

/* ---------- 首屏 hero（简化复刻） ---------- */
.md-wall-scroll { position: relative; overflow-y: auto; padding: 56px 20px 96px; }
.md-feed-hero { max-width: 560px; margin: 8px auto 34px; }
.md-hero-date { color: var(--ink3); font-size: 13px; line-height: 20px; margin-bottom: 12px; }
.md-hero-line { font-size: 30px; line-height: 44px; font-weight: 300; letter-spacing: -.015em; color: var(--ink3); }
.md-hero-line b { font-weight: 400; color: var(--ink); }
.md-hero-input { display: flex; align-items: center; gap: 10px; margin-top: 20px; max-width: 440px; height: 48px; padding: 0 10px 0 18px; border-radius: var(--r-xl); background: var(--card); box-shadow: var(--dsw-elevation-soft); color: var(--ink3); }
.md-hero-input input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font-size: 15px; }
.md-send { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; flex: none; background: var(--primary); color: var(--on-primary); opacity: .3; }

/* ---------- 灵感卡（与 client/styles.css 一致） ---------- */
.md-wall { columns: 236px; column-gap: 16px; max-width: 1500px; margin: 0 auto; }
.md-wall-cell { break-inside: avoid; margin-bottom: 16px; padding: 1px; }
.md-card { position: relative; display: block; width: 100%; border-radius: var(--r-xl); background: var(--card); box-shadow: var(--dsw-elevation-soft); overflow: hidden; }
.md-card-media { position: relative; margin: 6px 6px 0; border-radius: 14px; overflow: hidden; background: var(--hover); line-height: 0; }
.md-media { display: block; width: 100%; height: auto; object-fit: cover; }
.md-card-play { position: absolute; left: 8px; bottom: 8px; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: rgb(0 0 0 / .45); color: #fff; font-size: 10px; }
.md-card-caption { padding: 10px 14px 0; }
.md-card h3 { font-size: 13px; line-height: 19px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.md-card-quote { padding: 22px 20px 8px; font-family: var(--serif); font-size: 20px; line-height: 30px; font-weight: 500; letter-spacing: .01em; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.md-card-note { padding: 16px 16px 2px; }
.md-card-note h3 { font-size: 14px; line-height: 21px; font-weight: 600; -webkit-line-clamp: 3; }
.md-card-note p { margin-top: 6px; color: var(--ink2); font-size: 12.5px; line-height: 20px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.md-card-foot { display: flex; align-items: center; gap: 6px; padding: 8px 14px 12px; color: var(--ink3); font-size: 11.5px; line-height: 16px; min-height: 36px; }
.md-card-source { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.md-card-time { margin-left: auto; white-space: nowrap; }
.md-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ink4); }
.md-dot.status-outline { background: #d39a2c; } .md-dot.status-draft { background: #4176e6; }
.md-dot.status-ready { background: #8a5fe0; } .md-dot.status-published { background: #2fa36c; }
.md-card.is-inverted { background: var(--primary); color: var(--on-primary); }

/* ==========================================================
   方案 a · 现状复刻（真卡等比缩小）
   逐条对应 client/styles.css 147–187 行
   ========================================================== */
.md-capsule { --capsule-w: 352px; position: relative; display: flex; flex-direction: column; width: var(--capsule-w); cursor: pointer; user-select: none; }
.md-capsule-panel {
  position: relative; padding: 16px; border-radius: 32px;
  background: rgb(255 255 255 / .3); border: .5px solid rgb(0 0 0 / .08);
  backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .55), inset 0 0 0 .5px rgb(255 255 255 / .22), 0 18px 44px -18px rgb(0 0 0 / .28);
  transition: background .25s, box-shadow .25s;
}
.md-capsule:hover .md-capsule-panel { background: rgb(255 255 255 / .38); }
.md-capsule-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.md-capsule-cell { position: relative; width: 100%; aspect-ratio: 232 / 196; border-radius: var(--radius, 10px); overflow: hidden; }
.md-capsule-cell-inner { position: absolute; left: 0; top: 0; transform: scale(var(--fit, .4)); transform-origin: top left; pointer-events: none; }
.md-capsule-cell .md-card-media { height: 92px; }
.md-capsule-cell .md-card-media > .md-media { height: 100%; }
.md-capsule-cell .md-card-note p { -webkit-line-clamp: 3; }
.md-capsule-grid.is-large .md-capsule-cell { aspect-ratio: auto; height: 100%; }
.md-capsule-slot { aspect-ratio: 232 / 196; border-radius: 12px; }
.md-capsule-slot.is-large { border-radius: 16px; }
.md-capsule-foot { display: flex; align-items: baseline; justify-content: center; gap: 7px; padding: 10px 4px 0; }
.md-capsule-foot strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; line-height: 18px; font-weight: 600; }

/* ==========================================================
   方案 b · 封面格：格子里只放封面（媒体铺满 / 衬线首字），
   不做整体缩放。面板外壳与现状一致。
   ========================================================== */
.md-cov { position: relative; width: 100%; aspect-ratio: 232 / 196; border-radius: 12px; overflow: hidden; background: var(--hover); }
.md-cov > img { display: block; width: 100%; height: 100%; object-fit: cover; }
.md-cov .md-card-play { width: 18px; height: 18px; left: 6px; bottom: 6px; }
.md-cov.is-text { display: flex; align-items: center; justify-content: center; }
.md-cov.is-text i { font-style: normal; font-family: var(--serif); font-size: 34px; line-height: 1; color: rgb(0 0 0 / .55); }
.md-cov.is-web::after, .md-cov.is-video::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .06); border-radius: inherit; }

/* ==========================================================
   方案 c · 邮票版张：白纸版张 + 齿孔（沿用产品邮票的遮罩做法），
   成员是一枚枚 4:5 邮票；空位是空白票。
   ========================================================== */
.md-sheet {
  --s: 9px; --hole: 2.2px;
  position: relative; width: var(--capsule-w, 352px); padding: 12px;
  background: var(--card);
  -webkit-mask: radial-gradient(circle var(--hole), transparent 97%, #000) calc(var(--s) / -2) calc(var(--s) / -2) / var(--s) var(--s), linear-gradient(#000 0 0) center / calc(100% - var(--s)) calc(100% - var(--s)) no-repeat;
  mask: radial-gradient(circle var(--hole), transparent 97%, #000) calc(var(--s) / -2) calc(var(--s) / -2) / var(--s) var(--s), linear-gradient(#000 0 0) center / calc(100% - var(--s)) calc(100% - var(--s)) no-repeat;
  filter: drop-shadow(0 4px 10px rgb(0 0 0 / .1)) drop-shadow(0 16px 36px rgb(0 0 0 / .18));
  cursor: pointer; user-select: none;
}
.md-sheet-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.md-stamp-tile { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--hover); }
.md-stamp-tile > img { display: block; width: 100%; height: 100%; object-fit: cover; }
.md-stamp-tile.is-text { display: block; padding: 12px 11px; }
.md-stamp-tile.is-text i { font-style: normal; font-family: var(--serif); font-size: 12px; line-height: 20px; letter-spacing: .02em; color: rgb(0 0 0 / .74); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.md-stamp-tile.is-blank { background: rgb(0 0 0 / .03); }
.md-sheet .md-card-play { width: 16px; height: 16px; left: 5px; bottom: 5px; font-size: 9px; }
.md-sheet-foot { display: flex; justify-content: center; padding: 12px 4px 6px; }
.md-sheet-foot strong { font-size: 12.5px; line-height: 18px; font-weight: 600; }

/* 色纸（文字卡封面/邮票的底色，沿用 .tone-*） */
.tone-0 { background-color: #f6e2d5; } .tone-1 { background-color: #dfe7fb; } .tone-2 { background-color: #dcf0df; }
.tone-3 { background-color: #f6dfe9; } .tone-4 { background-color: #efe9cf; } .tone-5 { background-color: #e6dff7; }

/* ---------- 胶囊浮层 ---------- */
.md-capsule-mask { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 24px 72px; background: rgb(244 245 247 / .18); backdrop-filter: blur(20px) saturate(125%); -webkit-backdrop-filter: blur(20px) saturate(125%); animation: md-fade .2s both; }
@keyframes md-fade { from { opacity: 0; } }
.md-capsule-view {
  position: relative; display: flex; flex-direction: column; gap: 14px;
  width: min(680px, calc(100vw - 160px)); padding: 22px 24px 24px; border-radius: var(--r-panel);
  background: rgb(255 255 255 / .88); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .55), 0 30px 90px -30px rgb(0 0 0 / .45);
  animation: md-pop .35s cubic-bezier(.2, 1.2, .4, 1) both;
}
@keyframes md-pop { from { opacity: 0; transform: scale(.94); } }
.md-capsule-view-head { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.md-capsule-name { width: 100%; padding: 2px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font-size: 19px; line-height: 28px; font-weight: 600; text-align: center; outline: 0; }
.md-capsule-meta { color: var(--ink3); font-size: 11.5px; line-height: 16px; font-variant-numeric: tabular-nums; }
.md-capsule-grid.is-large { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

/* 浮层 a：现状复刻 */
.md-capsule-view .md-capsule-tile { position: relative; min-width: 0; aspect-ratio: 232 / 196; border-radius: 16px; }
.md-capsule-view .md-capsule-cell { border-radius: var(--radius, 16px); }

/* 浮层 b：封面格放大 + 真字号题注 */
.md-cov-tile { position: relative; min-width: 0; border-radius: 16px; background: var(--card); box-shadow: var(--dsw-elevation-soft); overflow: hidden; cursor: grab; }
.md-cov-tile .md-cov { aspect-ratio: 4 / 3; border-radius: 0; background: var(--hover); }
.md-cov-tile .md-cov.is-text i { font-size: 44px; }
.md-cov-tile-cap { display: flex; align-items: center; gap: 6px; padding: 8px 12px 10px; font-size: 12.5px; line-height: 18px; }
.md-cov-tile-cap span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.md-cov-tile-cap em { margin-left: auto; font-style: normal; color: var(--ink3); font-size: 11px; flex: none; }

/* 浮层 c：放大版张 + 邮票下方纸边题注 */
.md-sheet.is-large { --s: 11px; --hole: 2.6px; width: min(600px, calc((100vh - 220px) * .8 + 56px), calc(100vw - 160px)); padding: 18px; cursor: default; }
.md-sheet.is-large .md-sheet-grid { gap: 10px; }
.md-sheet-stamp { position: relative; min-width: 0; }
.md-sheet-stamp .md-stamp-tile { cursor: grab; }
.md-sheet-stamp-cap { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 6px 2px 4px; font-size: 11.5px; line-height: 16px; color: var(--ink2); }
.md-sheet-stamp-cap span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 方案 d · 异形卡堆：卡片按格子宽度重排（字号原大，不缩放），两列瀑布流自动填充；超过 4 张折叠成纸堆 ---------- */
.md-pile { position: relative; width: 352px; padding: 12px 12px 10px; background: var(--card); border-radius: 18px; box-shadow: var(--dsw-elevation-soft), 0 16px 36px -14px rgb(0 0 0 / .16); cursor: pointer; user-select: none; }
.md-pile-grid { columns: 2; column-gap: 10px; }
.md-pile-card { break-inside: avoid; margin-bottom: 10px; }
.md-pile-card .md-card { cursor: grab; }
.md-pile-card .md-card-media { height: 112px; }
.md-pile-card .md-card-media > .md-media { height: 100%; }
.md-pile-card .md-card-note p { -webkit-line-clamp: 3; }
.md-pile-card:nth-child(4n+1) .md-card { transform: rotate(-.5deg); }
.md-pile-card:nth-child(4n+3) .md-card { transform: rotate(.4deg); }
.md-pile-fold { display: flex; flex-direction: column; gap: 3px; padding: 0 6px; }
.md-pile-fold i { height: 7px; border-radius: 4px; background: var(--card); box-shadow: 0 2px 3px -1px rgb(0 0 0 / .14), inset 0 .5px 0 rgb(255 255 255 / .9); }
.md-pile-fold i:last-child { width: calc(100% - 12px); margin: 0 auto; opacity: .8; }
.md-pile.is-large { width: min(560px, calc(100vw - 160px)); padding: 16px 16px 14px; border-radius: var(--r-panel); cursor: default; }
.md-pile.is-large .md-pile-grid { column-gap: 12px; }
.md-pile.is-large .md-pile-card .md-card-media { height: 150px; }
.md-pile.is-large .md-pile-card .md-card-note p { -webkit-line-clamp: 4; }
.md-sheet.is-large .md-stamp-tile.is-text { padding: 18px 16px; }
.md-sheet.is-large .md-stamp-tile.is-text i { font-size: 14.5px; line-height: 26px; -webkit-line-clamp: 4; }

/* 翻页圆钮（对应 styles.css .md-capsule-page-btn） */
.md-capsule-page-btn {
  position: absolute; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 50%; color: var(--ink2); opacity: .55;
  background: rgb(255 255 255 / .92); box-shadow: var(--dsw-elevation-soft), inset 0 0 0 .5px var(--line-strong);
  transition: opacity .18s var(--ease), background .18s;
}
.md-capsule-page-btn.is-prev { left: -54px; }
.md-capsule-page-btn.is-next { right: -54px; }
.md-capsule-page-btn:hover:not(:disabled) { opacity: 1; background: var(--card); }
.md-capsule-page-btn:disabled { opacity: .18; cursor: default; font-size: 18px; }

/* ---------- 原型切换条 ---------- */
.proto-switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 999; display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 999px; background: #17181c; color: #fff; box-shadow: 0 18px 50px -12px rgb(0 0 0 / .5); font-size: 12.5px; line-height: 18px; white-space: nowrap; }
.proto-switcher button { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; background: rgb(255 255 255 / .14); font-size: 14px; }
.proto-switcher button:hover { background: rgb(255 255 255 / .26); }
.proto-switcher b { font-weight: 600; }
.proto-switcher .proto-label { min-width: 190px; text-align: center; }
</style>
</head>
<body class="md-root">
<div class="md-ambient"><i></i><i></i><i></i></div>
<div class="proto-note">原型 · 抛弃式对比页</div>
<div class="md-wall-scroll">
  <div class="md-feed-hero">
    <section class="md-hero">
      <p class="md-hero-date">2026 · 11 月 17 日 · 周二</p>
      <h1 class="md-hero-line">还有 <b>8 个灵感</b> 等你成稿，<br><b>2 条内容</b> 排在本周，你已经连续记录 <b>12 天</b>。</h1>
      <div class="md-hero-input"><input placeholder="记下一个灵感，或贴一个链接" aria-label="记下灵感"><span class="md-send">↑</span></div>
    </section>
  </div>
  <div id="strip"></div>
  <div class="md-wall" id="wall"></div>
</div>
<div id="overlay-root"></div>
<div class="proto-switcher">
  <button type="button" id="prev" aria-label="上一方案">←</button>
  <span class="proto-label"><b id="key">A</b> · <span id="name"></span></span>
  <button type="button" id="next" aria-label="下一方案">→</button>
</div>

<script>
// ---------- 数据（取自 src/seed.js，中文名与素材一一对应） ----------
const A = name => `../assets/${name}`
const ITEMS = [
  { id: 'i1',  kind: 'image', img: ['hills.jpg', 900, 620],  title: '普通人第一次用 AI 做出能赚钱的东西，到底卡在哪', src: '路上想到', status: 'draft', time: '' },
  { id: 'i2',  kind: 'quote', title: '好的选题不是想出来的，是被你反复抱怨出来的。', src: '读书笔记', status: 'outline', time: '' },
  { id: 'i3',  kind: 'video', img: ['v-aurora-poster.jpg', 540, 720], title: '30 秒看懂 Agent 和聊天机器人的区别', src: '竖屏脚本', status: 'outline', time: '周四 20:00' },
  { id: 'i4',  kind: 'web',   img: ['topo.jpg', 720, 720],   title: '一份给独立开发者的定价地图', src: 'example.com', status: 'outline', time: '' },
  { id: 'i5',  kind: 'image', img: ['facade.jpg', 720, 940], title: '老城立面：被时间改写的设计系统', src: '街拍', status: 'outline', time: '' },
  { id: 'i6',  kind: 'note',  title: '发布前 10 分钟检查清单', body: '标题有没有动词；前三秒说人话；封面手机上看得清；结尾只留一个行动。', src: '自用清单', status: 'ready', time: '待发布' },
  { id: 'i7',  kind: 'image', img: ['poster.jpg', 720, 960], title: '慢写：把一个念头养成一篇长文', src: '封面实验', status: 'published', time: '已发布' },

  { id: 'i11', kind: 'web',   img: ['collage.jpg', 780, 620],title: '十个让人想截图的数据图', src: 'example.com', status: 'outline', time: '' },

  { id: 'i13', kind: 'note',  title: '评论区问得最多的 5 个问题', body: '1. 没有技术背景能做吗；2. 每月成本多少；3. 用哪个模型；4. 数据安全吗；5. 多久能上手。', src: '评论区', status: 'outline', time: '' },
  { id: 'i14', kind: 'image', img: ['riso.jpg', 720, 860],   title: '封面用色实验：高饱和条纹为什么点击率高', src: '小红书', status: 'published', time: '已发布' },
  { id: 'i15', kind: 'quote', title: '你不是缺灵感，你是缺一个存放灵感的地方。', src: '随手记', status: 'outline', time: '' },
  { id: 'i16', kind: 'video', img: ['v-bus-poster.jpg', 720, 480], title: '夜班巴士上写完的第一个产品', src: '抖音', status: 'published', time: '已发布' },
  { id: 'i17', kind: 'image', img: ['sea.jpg', 900, 600],    title: '留白的勇气：三个删掉一半功能后变好的产品', src: '产品观察', status: 'outline', time: '' },
  { id: 'i18', kind: 'web',   img: ['stairs.jpg', 720, 720], title: '增长的台阶：从 0 到 1 万粉的真实阶段', src: '公众号', status: 'draft', time: '' },
  { id: 'i19', kind: 'image', img: ['still.jpg', 720, 860],  title: '桌上的橘子：一个关于「注意力」的开场', src: '灵感速记', status: 'outline', time: '' },
  { id: 'i20', kind: 'image', img: ['aurora.jpg', 800, 800], title: '渐变回潮：AI 产品的审美为什么越来越像', src: '趋势观察', status: 'outline', time: '' },
  { id: 'i21', kind: 'image', img: ['blush.jpg', 800, 800],  title: '给焦虑的新手写一封信', src: '读者来信', status: 'outline', time: '' },
  { id: 'i22', kind: 'image', img: ['night.jpg', 720, 900],  title: '城市夜光：给长文配图的 6 种情绪', src: '情绪板', status: 'outline', time: '' },
]
const byId = id => ITEMS.find(item => item.id === id)
const CAPSULES = [
  { id: 'c1', name: 'AI 变现观察', itemIds: ['i1', 'i3', 'i4', 'i6', 'i2', 'i9', 'i18', 'i13', 'i11'] },
  { id: 'c2', name: '设计隐喻', itemIds: ['i5', 'i10'] },
  { id: 'c3', name: '封面实验', itemIds: ['i14', 'i7', 'i22', 'i20'] },
]
const WALL_IDS = ['i8', 'i12', 'i15', 'i16', 'i17', 'i19', 'i21']
const KIND_LABEL = { image: '图片', video: '视频', web: '网页', quote: '金句', note: '笔记' }
const STATUS_LABEL = { outline: '构思', draft: '草稿', ready: '待发布', published: '已发布' }

// ---------- 共享渲染 ----------
function mediaHTML(item) {
  const [file, w, h] = item.img
  const play = item.kind === 'video' ? '<span class="md-card-play">▶</span>' : ''
  return `<div class="md-card-media"><img class="md-media" style="aspect-ratio:${w} / ${h}" src="${A(file)}" alt="" draggable="false">${play}</div>`
}
function cardHTML(item) {
  const media = item.img ? mediaHTML(item) : ''
  const body = item.kind === 'quote'
    ? `<blockquote class="md-card-quote">${item.title}</blockquote>`
    : item.kind === 'note'
      ? `<div class="md-card-note"><h3>${item.title}</h3>${item.body ? `<p>${item.body}</p>` : ''}</div>`
      : `<div class="md-card-caption"><h3>${item.title}</h3></div>`
  const inverted = item.status === 'published' ? 'is-inverted' : ''
  return `<article class="md-card kind-${item.kind} ${inverted}">${media}${body}
    <footer class="md-card-foot"><span class="md-dot status-${item.status}" title="${STATUS_LABEL[item.status]}"></span>
    <span class="md-card-source">${item.src}</span><span class="md-card-time">${item.time}</span></footer></article>`
}
// 封面语言（方案 b/c 共用）：媒体卡铺满封面，文字卡用色纸 + 衬线首字
function covHTML(item, { as = 'md-cov', textClass = 'is-text' } = {}) {
  if (item.img) {
    const [file] = item.img
    const play = item.kind === 'video' ? '<span class="md-card-play">▶</span>' : ''
    const kind = item.kind === 'web' ? 'is-web' : item.kind === 'video' ? 'is-video' : ''
    return `<div class="${as} ${kind}"><img src="${A(file)}" alt="" draggable="false">${play}</div>`
  }
  const ch = item.title.slice(0, 1)
  const tone = `tone-${item.id.charCodeAt(1) % 6}`
  return `<div class="${as} ${textClass} ${tone}"><i>${ch}</i></div>`
}

// ---------- 方案 a：现状复刻（真卡等比缩小进固定格子） ----------
function capsuleA(capsule) {
  const members = capsule.itemIds.map(byId)
  const cells = members.slice(0, 9).map(item => `
    <div class="md-capsule-cell"><div class="md-capsule-cell-inner" style="width:232px">${cardHTML(item)}</div></div>`)
  cells.push(...Array.from({ length: 9 - Math.min(members.length, 9) }, () => '<span class="md-capsule-slot" aria-hidden="true"></span>'))
  return `<article class="md-capsule" data-capsule="${capsule.id}">
    <div class="md-capsule-panel"><div class="md-capsule-grid">${cells.join('')}</div></div>
    <footer class="md-capsule-foot"><strong>${capsule.name}</strong></footer></article>`
}
// 与 React 版 CapsuleCell 相同的测量逻辑
function fitCapsuleA(root) {
  for (const cell of root.querySelectorAll('.md-capsule-cell')) {
    const width = cell.clientWidth
    const fit = width / 232
    cell.style.setProperty('--fit', fit)
    cell.style.setProperty('--radius', `${Math.round(20 * fit)}px`)
  }
}

// ---------- 方案 b：封面格 ----------
function capsuleB(capsule) {
  const members = capsule.itemIds.map(byId)
  const cells = members.slice(0, 9).map(item => covHTML(item))
  cells.push(...Array.from({ length: 9 - Math.min(members.length, 9) }, () => '<span class="md-capsule-slot" aria-hidden="true"></span>'))
  return `<article class="md-capsule" data-capsule="${capsule.id}">
    <div class="md-capsule-panel"><div class="md-capsule-grid">${cells.join('')}</div></div>
    <footer class="md-capsule-foot"><strong>${capsule.name}</strong></footer></article>`
}
function overlayB(capsule) {
  const members = capsule.itemIds.map(byId)
  const tiles = members.slice(0, 9).map(item => `
    <div class="md-cov-tile">${covHTML(item)}<div class="md-cov-tile-cap">
      <span class="md-dot status-${item.status}"></span><span>${item.title}</span><em>${KIND_LABEL[item.kind]}</em></div></div>`)
  tiles.push(...Array.from({ length: 9 - Math.min(members.length, 9) }, () => '<span class="md-capsule-slot is-large" aria-hidden="true"></span>'))
  return viewShell(capsule, `<div class="md-capsule-grid is-large">${tiles.join('')}</div>`)
}

// ---------- 方案 c：邮票版张 ----------
function capsuleC(capsule) {
  const members = capsule.itemIds.map(byId)
  const tiles = members.slice(0, 9).map(item => stampTileHTML(item))
  tiles.push(...Array.from({ length: 9 - Math.min(members.length, 9) }, () => '<div class="md-stamp-tile is-blank" aria-hidden="true"></div>'))
  return `<article data-capsule="${capsule.id}">
    <div class="md-sheet" style="--capsule-w:352px"><div class="md-sheet-grid">${tiles.join('')}</div></div>
    <div class="md-sheet-foot"><strong>${capsule.name}</strong></div></article>`
}
function stampTileHTML(item) {
  if (item.img) {
    const [file] = item.img
    const play = item.kind === 'video' ? '<span class="md-card-play">▶</span>' : ''
    return `<div class="md-stamp-tile"><img src="${A(file)}" alt="" draggable="false">${play}</div>`
  }
  const tone = `tone-${item.id.charCodeAt(1) % 6}`
  return `<div class="md-stamp-tile is-text ${tone}"><i>${item.title}</i></div>`
}
function overlayC(capsule) {
  const members = capsule.itemIds.map(byId)
  const tiles = members.slice(0, 9).map(item => `
    <div class="md-sheet-stamp">${stampTileHTML(item)}
      <div class="md-sheet-stamp-cap"><span class="md-dot status-${item.status}"></span><span>${item.img ? item.title : item.src}</span></div></div>`)
  tiles.push(...Array.from({ length: 9 - Math.min(members.length, 9) }, () => '<div class="md-stamp-tile is-blank" aria-hidden="true"></div>'))
  return `<div class="md-capsule-mask"><div class="md-sheet is-large" role="dialog" aria-modal="true">
    <div class="md-sheet-stamp-cap" style="justify-content:center;padding:0 0 12px;font-size:19px;line-height:28px;font-weight:600;color:var(--ink)">${capsule.name}</div>
    <div class="md-sheet-grid">${tiles.join('')}</div></div></div>`
}

// ---------- 方案 d：异形卡堆（按格子宽度重排真卡，字号原大；超过 4 张折叠） ----------
function capsuleD(capsule) {
  const members = capsule.itemIds.map(byId)
  const shown = members.slice(0, 4)
  const more = members.length - shown.length
  return `<article data-capsule="${capsule.id}">
    <div class="md-pile">
      <div class="md-pile-grid">${shown.map(item => `<div class="md-pile-card">${cardHTML(item)}</div>`).join('')}</div>
      ${more > 0 ? '<div class="md-pile-fold" aria-hidden="true"><i></i><i></i></div>' : ''}
    </div>
    <div class="md-sheet-foot"><strong>${capsule.name}</strong></div></article>`
}
function overlayD(capsule, page = 0) {
  const PER = 6
  const members = capsule.itemIds.map(byId)
  const pages = Math.max(1, Math.ceil(members.length / PER))
  const items = members.slice(page * PER, page * PER + PER)
  return `<div class="md-capsule-mask"><section class="md-pile is-large" role="dialog" aria-modal="true">
    <div class="md-capsule-view-head" style="margin-bottom:12px">
      <div class="md-capsule-name">${capsule.name}</div>
      ${pages > 1 ? `<p class="md-capsule-meta">第 ${page + 1} / ${pages} 页</p>` : ''}
    </div>
    <div class="md-pile-grid">${items.map(item => `<div class="md-pile-card">${cardHTML(item)}</div>`).join('')}</div>
    ${pages > 1 ? `
    <button type="button" class="md-capsule-page-btn is-prev" aria-label="上一页" ${page === 0 ? 'disabled' : ''}>‹</button>
    <button type="button" class="md-capsule-page-btn is-next" aria-label="下一页" ${page >= pages - 1 ? 'disabled' : ''}>›</button>` : ''}
  </section></div>`
}

// ---------- 浮层外壳（a/b 共用） ----------
function viewShell(capsule, gridHTML) {
  return `<div class="md-capsule-mask"><section class="md-capsule-view" role="dialog" aria-modal="true">
    <header class="md-capsule-view-head">
      <div class="md-capsule-name">${capsule.name}</div>
      ${capsule.itemIds.length > 9 ? `<p class="md-capsule-meta">第 1 / ${Math.ceil(capsule.itemIds.length / 9)} 页</p>` : ''}
    </header>${gridHTML}</section></div>`
}
function overlayA(capsule) {
  const members = capsule.itemIds.map(byId)
  const tiles = members.slice(0, 9).map(item => `
    <div class="md-capsule-tile"><div class="md-capsule-cell is-large">
      <div class="md-capsule-cell-inner" style="width:232px">${cardHTML(item)}</div></div></div>`)
  tiles.push(...Array.from({ length: 9 - Math.min(members.length, 9) }, () => '<span class="md-capsule-slot is-large" aria-hidden="true"></span>'))
  return viewShell(capsule, `<div class="md-capsule-grid is-large">${tiles.join('')}</div>`)
}

// ---------- 挂载与切换 ----------
const VARIANTS = [
  { key: 'a', label: '现状：真卡等比缩小', capsule: capsuleA, overlay: overlayA, fit: fitCapsuleA },
  { key: 'b', label: '封面格：媒体铺满 / 首字色纸', capsule: capsuleB, overlay: overlayB },
  { key: 'c', label: '邮票版张：齿孔白纸 + 文字票', capsule: capsuleC, overlay: overlayC },
  { key: 'd', label: '异形卡堆：原字号重排 + 折叠', capsule: capsuleD, overlay: overlayD },
]
const params = new URLSearchParams(location.search)
let current = VARIANTS.findIndex(v => v.key === (params.get('variant') || 'a'))
if (current < 0) current = 0

function render() {
  const variant = VARIANTS[current]
  document.getElementById('key').textContent = variant.key.toUpperCase()
  document.getElementById('name').textContent = variant.label
  const strip = document.getElementById('strip')
  strip.className = 'md-capsule-strip'
  strip.style.cssText = 'display:flex;gap:26px;overflow-x:auto;max-width:1500px;margin:0 auto 30px;padding:4px 4px 10px;align-items:flex-start'
  strip.innerHTML = CAPSULES.map(capsule => variant.capsule(capsule)).join('')
  if (variant.fit) variant.fit(strip)
  document.getElementById('wall').innerHTML = WALL_IDS.map(id => `<div class="md-wall-cell">${cardHTML(byId(id))}</div>`).join('')
  const openId = params.get('open')
  const overlayRoot = document.getElementById('overlay-root')
  const capsule = CAPSULES.find(row => row.id === openId)
  overlayRoot.innerHTML = capsule ? variant.overlay(capsule) : ''
  if (variant.fit && capsule) variant.fit(overlayRoot)
  const mask = overlayRoot.querySelector('.md-capsule-mask')
  mask?.addEventListener('pointerdown', event => { if (event.target === mask) { params.delete('open'); history.replaceState(null, '', `?${params}`); render() } })
}
function setVariant(step) {
  current = (current + step + VARIANTS.length) % VARIANTS.length
  params.set('variant', VARIANTS[current].key)
  history.replaceState(null, '', `?${params}`)
  render()
}
document.getElementById('prev').addEventListener('click', () => setVariant(-1))
document.getElementById('next').addEventListener('click', () => setVariant(1))
window.addEventListener('keydown', event => {
  if (event.target.closest('input,textarea')) return
  if (event.key === 'ArrowLeft') setVariant(-1)
  if (event.key === 'ArrowRight') setVariant(1)
})
render()
</script>
</body>
