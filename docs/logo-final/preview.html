<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>图文创作台 · Logo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eceff3;font-family:system-ui,"PingFang SC",sans-serif;color:#1f2329;padding:40px 32px}
h1{font-size:22px;font-weight:500;margin:0 0 4px}p{color:#717986;font-size:13px;margin:0 0 28px}
.panel{background:#fff;border-radius:18px;padding:26px 30px;box-shadow:0 10px 36px rgba(0,0,0,.07);margin-bottom:22px}
.panel h2{font-size:12px;font-weight:500;color:#8a919c;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 20px}
.row{display:flex;gap:40px;flex-wrap:wrap;align-items:center}
img{display:block}
.dark{background:#2c2f36;border-radius:12px;padding:20px 24px;display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.light{background:#f4f5f7;border-radius:12px;padding:20px 24px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
</style></head><body>
<h1>图文创作台 · 正式 Logo</h1>
<p>作者原作矢量版 · 蓝点为作者有意保留 · 全部素材本地引用</p>
<div class="panel"><h2>矢量母版 / 光栅母版</h2><div class="row">
  <img src="logo.svg" width="220">
  <img src="logo.png" width="220">
</div></div>
<div class="panel"><h2>图标 · 真实尺寸（深色栏底）</h2><div class="dark">
  <img src="icon-128.png" width="128"><img src="icon-64.png" width="64"><img src="icon-48.png" width="48"><img src="icon-32.png" width="32"><img src="icon-16.png" width="16">
</div></div>
<div class="panel"><h2>浅色背景检查</h2><div class="light">
  <img src="icon-128.png" width="96"><img src="icon-48.png" width="48"><img src="icon-32.png" width="32"><img src="icon-16.png" width="16">
</div></div>
</body></html>
